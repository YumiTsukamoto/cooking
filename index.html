<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>おりょうりごっこ｜くまシェフのキッチン</title>
<meta name="description" content="ようじむけの おりょうり ゲーム。スーパー・キッチン・もりつけの 3ステージで カレーを つくろう！">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ========== デザイントークン ==========
   どうぶつの森ふうの「やさしい木と草」パレット */
:root{
  --grass:#8ED45C;
  --grass-dark:#5FA83C;
  --cream:#FFF6E0;
  --cream-2:#FFE9BC;
  --wood:#D8A165;
  --wood-dark:#A9713F;
  --ink:#5A4632;
  --pink:#FF9EB5;
  --sky:#BFE9F5;
  --shadow:rgba(90,70,50,.22);
  --r:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",sans-serif;
  font-weight:800;
  color:var(--ink);
  background:var(--grass);
  background-image:
    radial-gradient(circle at 12% 22%, rgba(255,255,255,.28) 0 7px, transparent 8px),
    radial-gradient(circle at 62% 68%, rgba(255,255,255,.22) 0 5px, transparent 6px),
    radial-gradient(circle at 88% 32%, rgba(255,255,255,.18) 0 9px, transparent 10px);
  background-size:180px 180px,140px 140px,220px 220px;
  overflow:hidden;
  user-select:none;
}
#app{
  position:relative;
  height:100dvh;
  max-width:600px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
}

/* ---------- ヘッダー ---------- */
header{
  position:relative;z-index:55;
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  padding:8px 4px 4px;
}
.leafbar{display:flex;gap:5px;flex:1}
.leaf{width:26px;height:26px;opacity:.35;transition:.3s}
.leaf.on{opacity:1;transform:scale(1.12)}
.iconbtn{
  width:42px;height:42px;border:none;border-radius:50%;
  background:var(--cream);box-shadow:0 3px 0 var(--wood-dark);
  font-size:19px;line-height:1;cursor:pointer;color:var(--ink);
  display:grid;place-items:center;
}
.iconbtn:active{transform:translateY(3px);box-shadow:none}
.iconbtn.off{opacity:.45}

/* ---------- くまシェフの ふきだし ---------- */
.talk{
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;padding:2px 2px 8px;
}
.bear{width:66px;height:66px;flex:0 0 auto;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.bubble{
  position:relative;flex:1;
  background:var(--cream);border-radius:20px;
  padding:12px 14px;font-size:17px;line-height:1.45;
  box-shadow:0 4px 0 var(--wood-dark);
  min-height:56px;display:flex;align-items:center;
}
.bubble::before{
  content:"";position:absolute;left:-9px;top:50%;margin-top:-9px;
  border:9px solid transparent;border-right-color:var(--cream);
}
.bubble.wiggle{animation:wig .4s}
@keyframes wig{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- つかう ざいりょう リスト ---------- */
#needbar{
  flex:0 0 auto;display:none;align-items:center;justify-content:center;gap:5px;
  background:var(--cream);border-radius:18px;
  box-shadow:0 4px 0 var(--wood-dark);
  padding:5px 8px;margin-bottom:8px;
}
#needbar b{font-size:12px;color:var(--wood-dark);margin-right:2px;line-height:1.15;text-align:center}
#needbar span{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:11px;padding:3px 5px;border-radius:11px;min-width:46px;
  border:2px dashed var(--wood);
}
#needbar span.got{background:#DFF3C9;color:var(--grass-dark);border-style:solid;border-color:#8ED45C}
#needbar span.got::after{content:"⭕️";font-size:10px;line-height:1}
#needbar svg{width:26px;height:26px}

/* ---------- シーン ---------- */
#scene{
  flex:1 1 auto;min-height:0;
  background:var(--cream);
  border-radius:var(--r);
  box-shadow:0 6px 0 var(--wood-dark);
  overflow:hidden;position:relative;
  display:flex;
}
#scene > svg{width:100%;height:100%;display:block}
.shoplist{
  position:absolute;left:10px;top:10px;width:37%;max-height:calc(100% - 20px);
  background:rgba(255,255,255,.92);border-radius:18px;
  border:3px dashed var(--wood);
  padding:8px 6px;display:flex;flex-direction:column;gap:2px;
  overflow:hidden;
}
.shoplist h3{margin:0 0 2px;font-size:13px;text-align:center;color:var(--wood-dark)}
.shoplist li{
  list-style:none;display:flex;align-items:center;gap:5px;
  font-size:13px;padding:2px 3px;border-radius:9px;
  white-space:nowrap;
}
@media (max-width:400px){ .shoplist li{font-size:11px} .shoplist li svg{width:18px;height:18px} }
.shoplist ul{margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.shoplist li svg{width:22px;height:22px;flex:0 0 auto}
.shoplist li.got{background:#DFF3C9;color:var(--grass-dark)}
.shoplist li.got::after{content:"⭕️";margin-left:auto;font-size:12px}

/* ---------- どうぐトレイ ---------- */
#tray{
  flex:0 0 auto;
  margin-top:8px;
  background:var(--wood);
  border-radius:var(--r);
  box-shadow:0 6px 0 var(--wood-dark);
  padding:10px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  max-height:40dvh;overflow:auto;
}
.card{
  background:var(--cream);border:none;border-radius:18px;
  box-shadow:0 4px 0 rgba(0,0,0,.16);
  padding:6px 2px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  font:inherit;color:var(--ink);font-size:12px;
  transition:transform .12s;
}
.card svg{width:100%;height:auto;aspect-ratio:1;max-height:60px}
.card:active{transform:translateY(4px);box-shadow:none}
.card.done{opacity:.35;pointer-events:none}
.card.shake{animation:sh .38s}
#tray.busy{pointer-events:none}
#tray.busy .card{opacity:.4}
.chopTarget{cursor:pointer}
@keyframes chop{
  0%{transform:translateY(0)}
  38%{transform:translateY(56px)}
  58%{transform:translateY(44px)}
  100%{transform:translateY(0)}
}
#scene .knife.go{animation:chop .42s ease-in-out}
@keyframes sh{20%{transform:rotate(-8deg)}60%{transform:rotate(8deg)}}

/* ---------- とぶ アイコン ---------- */
.ghost{
  position:fixed;z-index:60;pointer-events:none;
  transition:transform .55s cubic-bezier(.4,-0.3,.6,1),opacity .55s;
}
.ghost svg{width:100%;height:100%}

/* ---------- キラキラ ---------- */
.spark{
  position:fixed;z-index:59;pointer-events:none;font-size:22px;
  animation:sp .8s ease-out forwards;
}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(180deg);opacity:0}}

/* ---------- オーバーレイ（タイトル・ステージ・クリア） ---------- */
.overlay{
  position:absolute;inset:0;z-index:50;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:22px;text-align:center;
  background:rgba(94,168,60,.94);
  animation:fade .35s;
}
@keyframes fade{from{opacity:0}}
.overlay.hide{display:none}
.plank{
  background:var(--cream);border-radius:24px;
  box-shadow:0 7px 0 var(--wood-dark);
  padding:18px 22px;max-width:420px;
}
.plank h1{margin:0;font-size:clamp(26px,7vw,38px);line-height:1.2}
.plank h2{margin:0;font-size:clamp(20px,5.6vw,27px)}
.plank p{margin:8px 0 0;font-size:15px;font-weight:700;line-height:1.6}
.big{
  border:none;border-radius:999px;padding:15px 34px;
  font:inherit;font-size:20px;color:#fff;cursor:pointer;
  background:var(--pink);box-shadow:0 6px 0 #D96C86;
}
.big:active{transform:translateY(5px);box-shadow:none}
.big.green{background:var(--grass-dark);box-shadow:0 6px 0 #3E7A26}
.big.wood{background:#C98240;box-shadow:0 6px 0 #96591F}
.overlay svg.hero{width:min(56vw,210px);height:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.small{font-size:16px;padding:12px 22px}

@media (max-height:660px){
  .bear{width:52px;height:52px}
  .bubble{font-size:15px;min-height:46px;padding:9px 12px}
  .card svg{max-height:46px}
  #tray{gap:6px;padding:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="leafbar" id="leafbar"></div>
    <button class="iconbtn" id="btnVoice" aria-label="こえ">🔈</button>
    <button class="iconbtn" id="btnHome" aria-label="さいしょから">🏠</button>
  </header>

  <div class="talk">
    <div class="bear" id="bearBox"></div>
    <div class="bubble" id="bubble">じゅんびちゅう…</div>
  </div>

  <div id="needbar"></div>
  <div id="scene"></div>
  <div id="tray"></div>

  <div class="overlay" id="overlay"></div>
</div>

/* ならびかえ（まいかい ちがう ばしょに でる） */
function shuffled(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

let actx = null;
function beep(freqs, dur=.12, type="sine"){
  if(!voiceOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      const t = actx.currentTime + i*dur;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(.22,t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t+dur+.02);
    });
  }catch(e){}
}
const sndGood  = ()=>beep([784,1046],.12);
const sndBad   = ()=>beep([300,220],.14,"triangle");
const sndClear = ()=>beep([523,659,784,1046],.16);

/* === こえ ===
   voice/ フォルダに ろくおんファイルが あれば それを ながし、
   なければ ブラウザの よみあげ（きかいおんせい）に なります。
   ろくおんだけを つかいたい ときは VOICE_ON_MISSING を "silent" に してください。 */
const VOICE_ON_MISSING = "tts";                  /* "tts" または "silent" */
const VOICE_EXT = ["m4a","mp3","webm","wav"];    /* この じゅんばんで さがします */
const voiceCache = {};
let curAudio = null;
/* voice/on.txt が あれば ろくおんファイルを さがします（むだな つうしんを ふせぐ） */
let voiceFolder = false;
try{ fetch("voice/on.txt", {cache:"no-store"}).then(r=>{ voiceFolder = r.ok; }).catch(()=>{}); }catch(e){}

/* もじれつから ファイルめいを つくる（かならず おなじ なまえに なる） */
function voiceKey(t){
  let h = 2166136261;
  for(let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h,16777619); }
  const tag = t.replace(/[^ぁ-んァ-ヶー一-龥0-9A-Za-z]/g,"").slice(0,12);
  return tag + "_" + (h>>>0).toString(36).slice(0,5);
}

function stirPrompt(st, n){
  return st.vessel === "bowl"
    ? `ボウルの なかを ${n}かい タップして こねよう！`
    : `なべの なかを ${n}かい タップして ぐるぐる！`;
}

function tts(text){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = .95; u.pitch = 1.25;
    speechSynthesis.speak(u);
  }catch(e){}
}

function say(text){
  if(!voiceOn || !text) return;
  if(curAudio){ try{ curAudio.pause(); }catch(e){} curAudio = null; }
  if(window.speechSynthesis) speechSynthesis.cancel();

  const id = voiceKey(text);
  if(!voiceFolder || voiceCache[id] === "none"){
    if(VOICE_ON_MISSING === "tts") tts(text);
    return;
  }
  const a = document.createElement("audio");
  a.preload = "auto";
  VOICE_EXT.forEach(ext=>{
    const src = document.createElement("source");
    src.src = "voice/" + encodeURIComponent(id) + "." + ext;
    a.appendChild(src);
  });
  curAudio = a;
  const pr = a.play();
  if(pr && pr.catch) pr.catch(()=>{});
  /* ぜんぶの ファイルが なければ networkState が 3 に なる */
  let tries = 0;
  const check = ()=>{
    if(curAudio !== a) return;
    if(a.networkState === 3){
      voiceCache[id] = "none";
      if(VOICE_ON_MISSING === "tts") tts(text);
      return;
    }
    if(a.readyState >= 2){ voiceCache[id] = "ok"; return; }
    if(++tries < 12) setTimeout(check, 120);
  };
  setTimeout(check, 100);
}

/* ろくおんページ（record.html）が よみとる、ぜんぶの セリフ */
function allVoiceLines(){
  const out = [], seen = {};
  const add = (t, group)=>{
    if(!t || seen[t]) return;
    seen[t] = 1;
    out.push({ id:voiceKey(t), text:t, group:group });
  };
  Object.keys(RECIPES).forEach(k=>{
    const r = RECIPES[k];
    r.stages.forEach(stg=>{
      add(stg.intro + "。" + stg.introText, r.name + "／ステージ");
      add(stg.name + "クリア！ " + stg.clear, r.name + "／ステージ");
      stg.steps.forEach(st=>{
        add(st.say, r.name + "／" + stg.name);
        if(st.waitSay) add(st.waitSay, r.name + "／" + stg.name);
        if(st.mode === "chop"){
          st.need.forEach(id=>{
            add(`${LABEL[id]}を ${st.chops||3}かい タップして トントン！`, r.name + "／きる");
            add(`${LABEL[id]} きれたね！`, r.name + "／きる");
          });
        }
        if(st.mode === "stir"){
          add(stirPrompt(st, st.times||3), r.name + "／まぜる");
          add("よく まざったね！", "まぜる");
        }
        if(st.wrong) Object.keys(st.wrong).forEach(w=>
          add(st.wrong[w], r.name + "／" + stg.name + "（まちがえた とき）"));
      });
    });
  });
  PRAISE.forEach(t=>add(t, "ほめことば"));
  NUDGE.forEach(t=>add(t, "ヒント"));
  add("できあがり！ いただきまーす！", "できあがり");
  return out;
}
window.allVoiceLines = allVoiceLines;

/* ==== まないたシーン（のせる → トントン きる） ==== */
function chopPieces(id, cuts, chops){
  const inner = ART[id].replace(/<svg[^>]*>/,"").replace(/<\/svg>/,"");
  if(cuts >= chops){                      // きりおわり
    const c = ART[CUT[id]].replace(/<svg[^>]*>/,"").replace(/<\/svg>/,"");
    return c;
  }
  const n = cuts + 1;                     // 1 → 2 → 3 きれ
  const gap = n === 2 ? 12 : 9;
  let out = "";
  for(let i=0;i<n;i++){
    const dy = (i - (n-1)/2) * gap;
    out += `<g transform="translate(0 ${dy})"><g clip-path="url(#cl${n}_${i})">${inner}</g></g>`;
  }
  return out;
}

/* とびら（ちょうつがい を じくに ひらく） */
function doorGroup(hinge, inner, opened, anim){
  if(!opened) return inner;
  if(anim) return `<g transform="translate(${hinge} 0)"><g>
      <animateTransform attributeName="transform" type="scale" from="1 1" to="0.13 1"
        dur=".45s" fill="freeze"/>
      <g transform="translate(${-hinge} 0)">${inner}</g></g></g>`;
  return `<g transform="translate(${hinge} 0)"><g transform="scale(0.13 1)">
      <g transform="translate(${-hinge} 0)">${inner}</g></g></g>`;
}

/* なかの ものを えらべる かたちに */
function pickItem(id, x, y, sc, cx, cy, on){
  const icon = iconGroup(id, x, y, sc);
  if(!on) return icon;
  return `<g class="pickTarget" data-id="${id}">${icon}
    <circle cx="${cx}" cy="${cy}" r="26" fill="#FFF" opacity="0"/></g>`;
}

/* うえ下に ひらく とびら（オーブン） */
function doorGroupY(hinge, inner, opened, anim){
  if(!opened) return inner;
  if(anim) return `<g transform="translate(0 ${hinge})"><g>
      <animateTransform attributeName="transform" type="scale" from="1 1" to="1 0.12"
        dur=".45s" fill="freeze"/>
      <g transform="translate(0 ${-hinge})">${inner}</g></g></g>`;
  return `<g transform="translate(0 ${hinge})"><g transform="scale(1 0.12)">
      <g transform="translate(0 ${-hinge})">${inner}</g></g></g>`;
}

/* ---------------------------------------------------------------
   6. がめんの こうしん
   --------------------------------------------------------------- */
const $ = s=>document.querySelector(s);
const sceneEl = $("#scene"), trayEl = $("#tray"), bubbleEl = $("#bubble"), overlay = $("#overlay");

function drawLeaves(){
  $("#leafbar").innerHTML = STAGES.map((s,i)=>
    `<span class="leaf ${i<stageIdx?'on':''}">${ART.leaf}</span>`).join("");
}

const needEl = document.querySelector("#needbar");

/* つかう ざいりょうを うえに ならべる */
function drawNeedbar(){
  const st = currentStep();
  const show = st.need.length > 1 && STAGES[stageIdx].scene !== "shop";
  needEl.style.display = show ? "flex" : "none";
  if(!show){ needEl.innerHTML = ""; return; }
  const total = st.repeat || 1;
  needEl.innerHTML = `<b>${st.listTitle || "つかう<br>もの"}</b>` + st.need.map(id=>{
    const got = (hits[id]||0) >= total;
    return `<span class="${got?"got":""}">${ART[id]}${LABEL[id]}</span>`;
  }).join("");
}

function drawScene(){
  const sc = STAGES[stageIdx].scene;
  sceneEl.innerHTML = (state.act && state.act.mode === "chop") ? sceneChop()
    : sc==="shop" ? sceneShop()
    : sc==="kitchen" ? sceneKitchen()
    : sc==="oven" ? sceneOven()
    : sc==="serve" ? sceneServe() : sceneTable();
  state.openAnim = false;
  drawNeedbar();
}

function currentStep(){ return STAGES[stageIdx].steps[stepIdx]; }

function drawStep(){
  const st = currentStep();
  const order = st.shuffle ? shuffled(st.tray) : st.tray;
  bubbleEl.textContent = st.say;
  say(st.say);
  trayEl.style.display = st.tray.length ? "grid" : "none";
  trayEl.classList.remove("busy");
  trayEl.style.gridTemplateColumns = `repeat(${st.tray.length>6?4:3},1fr)`;
  trayEl.innerHTML = order.map(id=>{
    const need = st.need.includes(id);
    const total = need ? (st.repeat||1) : 0;
    const done = need && (hits[id]||0) >= total;
    return `<button class="card ${done?'done':''}" data-id="${id}">
      ${ART[id]}<span>${LABEL[id]}</span></button>`;
  }).join("");
  drawScene();
  drawLeaves();
}

/* ---------------------------------------------------------------
   7. タップの しょり
   --------------------------------------------------------------- */
function sparkle(x,y){
  for(let i=0;i<7;i++){
    const s = document.createElement("div");
    s.className = "spark";
    s.textContent = ["✨","⭐️","💛"][i%3];
    s.style.left = x+"px"; s.style.top = y+"px";
    s.style.setProperty("--dx",(Math.random()*160-80)+"px");
    s.style.setProperty("--dy",(-Math.random()*120-30)+"px");
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),820);
  }
}

function fly(cardEl){
  const a = cardEl.getBoundingClientRect(), b = sceneEl.getBoundingClientRect();
  const g = document.createElement("div");
  g.className = "ghost";
  g.innerHTML = cardEl.querySelector("svg").outerHTML;
  Object.assign(g.style,{left:a.left+"px",top:a.top+"px",width:a.width+"px",height:a.height+"px"});
  document.body.appendChild(g);
  requestAnimationFrame(()=>{
    const dx = (b.left+b.width*0.55) - (a.left+a.width/2);
    const dy = (b.top+b.height*0.6) - (a.top+a.height/2);
    g.style.transform = `translate(${dx}px,${dy}px) scale(.35) rotate(25deg)`;
    g.style.opacity = ".15";
  });
  setTimeout(()=>g.remove(),600);
}

/* せいかいの ときの きょうつう しょり */
function registerHit(id, opt){
  opt = opt || {};
  const st = currentStep();
  const card = trayEl.querySelector('.card[data-id="'+id+'"]');
  const total = st.repeat || 1;

  hits[id] = (hits[id]||0) + 1;
  st.hit && st.hit(id);
  sndGood();
  if(card && opt.fly !== false) fly(card);
  if(opt.sparkAt) sparkle(opt.sparkAt[0], opt.sparkAt[1]);
  else if(card){ const r = card.getBoundingClientRect(); sparkle(r.left + r.width/2, r.top); }
  drawScene();

  if(hits[id] >= total){ card && card.classList.add("done"); }
  else { bubbleEl.textContent = `あと ${total - hits[id]} かい！`; return; }

  const finished = st.need.every(n => (hits[n]||0) >= total);
  if(!finished){
    const p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    bubbleEl.textContent = p + " つぎも いこう！";
    say(p);
    return;
  }

  /* ステップ クリア */
  busy = true;
  if(st.wait){
    bubbleEl.textContent = st.waitSay || "…";
    say(st.waitSay || "");
    drawScene();
    setTimeout(()=>{ st.after && st.after(); busy=false; nextStep(); }, st.wait);
  }else{
    st.after && st.after();
    const p = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    bubbleEl.textContent = p;
    say(p);
    setTimeout(()=>{ busy=false; nextStep(); }, 900);
  }
}

/* まちがえた ときの しょり */
function nudge(card, st, id){
  sndBad();
  if(card){ card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); }
  const msg = (st.wrong && st.wrong[id]) || NUDGE[Math.floor(Math.random()*NUDGE.length)];
  bubbleEl.textContent = msg;
  bubbleEl.classList.remove("wiggle"); void bubbleEl.offsetWidth; bubbleEl.classList.add("wiggle");
  say(msg);
  setTimeout(()=>{ if(!busy && !state.act) bubbleEl.textContent = st.say; },1800);
}

/* --- どうぐトレイを タップ --- */
trayEl.addEventListener("click", e=>{
  const card = e.target.closest(".card");
  if(!card || busy || state.act) return;
  const id = card.dataset.id, st = currentStep();

  if(!st.need.includes(id)){ nudge(card, st, id); return; }

  /* まないたに のせる / おたまを もつ */
  if(st.mode === "chop" || st.mode === "stir"){
    const total = st.mode === "chop" ? (st.chops||3) : (st.times||3);
    state.act = { mode:st.mode, id:id, cuts:0, count:0, total:total, anim:false };
    st.hold && st.hold(id);
    card.classList.add("done");
    trayEl.classList.add("busy");
    beep([660,880],.1);
    fly(card);
    drawScene();
    const msg = st.mode === "chop"
      ? `${LABEL[id]}を ${total}かい タップして トントン！`
      : stirPrompt(st, total);
    bubbleEl.textContent = msg; say(msg);
    return;
  }

  registerHit(id);
});

/* --- シーンを タップ --- */
sceneEl.addEventListener("click", e=>{
  if(busy) return;
  const st = currentStep(), act = state.act;

  /* まないたで きる */
  if(act && act.mode === "chop"){
    if(!e.target.closest(".chopTarget")) return;
    act.cuts++; act.anim = true;
    beep([520,180],.07,"square");
    drawScene(); act.anim = false;
    const left = act.total - act.cuts;
    if(left > 0){ bubbleEl.textContent = `トントン！ あと ${left}かい`; return; }
    finishAct(`${LABEL[act.id]} きれたね！`);
    return;
  }

  /* なべで まぜる */
  if(act && act.mode === "stir"){
    if(!e.target.closest(".stirTarget")) return;
    act.count++; act.anim = true;
    beep([300,430],.09);
    drawScene(); act.anim = false;
    const left = act.total - act.count;
    if(left > 0){ bubbleEl.textContent = `ぐるぐる！ あと ${left}かい`; return; }
    finishAct("よく まざったね！");
    return;
  }

  /* かぐ・かでんを あける */
  const f = e.target.closest(".furniTarget");
  if(f){
    if(st.need.includes(f.dataset.f)){          /* オーブンなど かぐ じたいが せいかい */
      const rf = f.getBoundingClientRect();
      state.open = null;
      registerHit(f.dataset.f, { fly:false, sparkAt:[rf.left + rf.width/2, rf.top + rf.height/2] });
      return;
    }
    state.open = f.dataset.f;
    state.openAnim = true;
    beep([440,620],.12);
    drawScene();
    return;
  }

  /* なかの ものを えらぶ */
  const pick = e.target.closest(".pickTarget");
  if(pick){
    const id = pick.dataset.id;
    if(!st.need.includes(id)){ nudge(null, st, id); return; }
    const total = st.repeat || 1;
    const r = pick.getBoundingClientRect();
    if((hits[id]||0) + 1 >= total) state.open = null;
    registerHit(id, { fly:false, sparkAt:[r.left + r.width/2, r.top + r.height/2] });
  }
});

/* きる・まぜるが おわった ときの しめくくり */
function finishAct(msg){
  const act = state.act;
  busy = true;
  bubbleEl.textContent = msg; say(msg);
  const r = sceneEl.getBoundingClientRect();
  setTimeout(()=>{
    const id = act.id;
    state.act = null;
    trayEl.classList.remove("busy");
    busy = false;
    registerHit(id, { fly:false, sparkAt:[r.left + r.width/2, r.top + r.height*0.55] });
  }, 800);
}

function nextStep(){
  hits = {};
  stepIdx++;
  if(stepIdx < STAGES[stageIdx].steps.length){ drawStep(); return; }
  stageClear();
}

/* ---------------------------------------------------------------
   8. オーバーレイ（タイトル・ステージ・クリア）
   --------------------------------------------------------------- */
function showOverlay(html){ overlay.innerHTML = html; overlay.classList.remove("hide"); }
function hideOverlay(){ overlay.classList.add("hide"); }

function title(){
  resetState();
  drawLeaves(); trayEl.innerHTML = ""; sceneEl.innerHTML = "";
  bubbleEl.textContent = "きょうは なにを つくろうかな？";
  showOverlay(`
    <div style="width:min(46vw,165px)">${bearSVG()}</div>
    <div class="plank">
      <h1>おりょうりごっこ</h1>
      <p>くまシェフと いっしょに<br>おりょうりを つくろう！<br>なにを つくる？</p>
    </div>
    <div class="row">
      <button class="big" id="goCurry">🍛 カレーライス</button>
      <button class="big green" id="goGratin">🧀 グラタン</button>
      <button class="big wood" id="goHamburg">🍽️ ハンバーグ</button>
    </div>`);
  $("#goCurry").onclick  = ()=>{ beep([523,784]); pickRecipe("curry"); };
  $("#goGratin").onclick = ()=>{ beep([523,784]); pickRecipe("gratin"); };
  $("#goHamburg").onclick = ()=>{ beep([523,784]); pickRecipe("hamburg"); };
}

function pickRecipe(key){
  recipeKey = key;
  STAGES = RECIPES[key].stages;
  resetState();
  startStage(0);
}

function startStage(i){
  stageIdx = i; stepIdx = 0; hits = {};
  drawLeaves();
  const s = STAGES[i];
  showOverlay(`
    <div class="plank">
      <h2>${s.emoji} ${s.intro}</h2>
      <p>${s.introText}</p>
    </div>
    <button class="big green" id="go">はじめる</button>`);
  say(s.intro + "。" + s.introText);
  $("#go").onclick = ()=>{ beep([659,880]); hideOverlay(); drawStep(); };
}

function stageClear(){
  sndClear();
  const s = STAGES[stageIdx];
  if(stageIdx < STAGES.length-1){
    showOverlay(`
      <div style="width:min(40vw,150px)">${bearSVG()}</div>
      <div class="plank"><h2>${s.emoji} ${s.name} クリア！</h2><p>${s.clear}</p></div>
      <button class="big green" id="go">つぎへ すすむ</button>`);
    say(s.name + "クリア！ " + s.clear);
    $("#go").onclick = ()=>{ beep([659,880]); startStage(stageIdx+1); };
  }else{
    stageIdx = STAGES.length; drawLeaves(); stageIdx = STAGES.length-1;
    showOverlay(`
      <div style="width:min(46vw,170px)">${bearSVG()}</div>
      <div class="plank">
        <h1>できあがり！</h1>
        <p>おいしそうな ${RECIPES[recipeKey].name}の かんせい！<br>くまシェフが よろこんで いるよ 🎉</p>
      </div>
      <div style="width:min(60vw,230px);background:#FFF6E0;border-radius:20px;padding:6px">
        ${RECIPES[recipeKey].finish()}
      </div>
      <div class="row">
        <button class="big small green" id="again">もういちど</button>
        <button class="big small" id="home">さいしょへ</button>
      </div>`);
    say("できあがり！ いただきまーす！");
    $("#again").onclick = ()=>{ beep([523,784]); pickRecipe(recipeKey); };
    $("#home").onclick  = ()=>{ beep([440,660]); title(); };
  }
}

$("#btnVoice").onclick = e=>{
  voiceOn = !voiceOn;
  e.currentTarget.textContent = voiceOn ? "🔈" : "🔇";
  e.currentTarget.classList.toggle("off", !voiceOn);
  if(!voiceOn && window.speechSynthesis) speechSynthesis.cancel();
  else beep([784]);
};
